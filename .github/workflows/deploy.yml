name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CI: true

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    name: Deploy Web
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro SSR
        env:
          NODE_ENV: production
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID || 'xvhhd8u0' }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET || 'production' }}
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY || '0x4AAAAAAFXbqPn5Jkh6bMhV' }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_HOSTNAMES: ${{ secrets.TURNSTILE_HOSTNAMES || 'localhost,127.0.0.1,gwenvenni.com' }}
        run: npm run build

      - name: Deploy Web to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LOGTO_APP_SECRET: ${{ secrets.LOGTO_APP_SECRET }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN secret is not set in GitHub Repository Secrets. Skipping GitHub Actions deploy step (if using Cloudflare Dashboard Git integration, deployment is handled automatically by Cloudflare)."
            exit 0
          fi
          if [ -n "$CF_ACCOUNT_ID" ]; then
            export CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT_ID"
          else
            echo "::notice::CLOUDFLARE_ACCOUNT_ID secret not set; Wrangler will auto-resolve if the API token is scoped to a single account."
          fi
          if [ -n "$LOGTO_APP_SECRET" ]; then
            echo "$LOGTO_APP_SECRET" | npx wrangler secret put LOGTO_APP_SECRET || true
          fi

          # Auto-discover and persist Cloudflare D1 database binding so redeployment never unbinds D1
          HAS_VALID_D1=$(node -e '
            const fs = require("fs");
            const text = fs.readFileSync("wrangler.jsonc", "utf8");
            const match = text.match(/"database_id":\s*"([0-9a-fA-F-]{36})"/);
            console.log(match ? match[1] : "");
          ')

          if [ -z "$HAS_VALID_D1" ]; then
            echo "Searching Cloudflare for user D1 database..."
            RESOLVED_D1=$(npx wrangler d1 list --json 2>/dev/null | node -e '
              let input = "";
              process.stdin.on("data", c => input += c);
              process.stdin.on("end", () => {
                try {
                  const dbs = JSON.parse(input);
                  if (Array.isArray(dbs) && dbs.length > 0) {
                    const match = dbs.find(d => /b2b/i.test(d.name)) || dbs[0];
                    if (match && match.uuid) {
                      console.log(match.name + ":::" + match.uuid);
                    }
                  }
                } catch {}
              });
            ' || true)

            if [ -n "$RESOLVED_D1" ]; then
              DB_NAME="${RESOLVED_D1%%:::*}"
              DB_UUID="${RESOLVED_D1##*:::}"
              echo "✓ Found D1 database in Cloudflare account: $DB_NAME ($DB_UUID)"
              node -e "
                const fs = require('fs');
                let text = fs.readFileSync('wrangler.jsonc', 'utf8');
                if (!text.includes('\"d1_databases\"')) {
                  const d1Block = '  \"d1_databases\": [\n    {\n      \"binding\": \"DB\",\n      \"database_name\": \"$DB_NAME\",\n      \"database_id\": \"$DB_UUID\"\n    }\n  ],\n  \"observability\"';
                  text = text.replace('\"observability\"', d1Block);
                  fs.writeFileSync('wrangler.jsonc', text, 'utf8');
                  console.log('Successfully injected D1 binding into wrangler.jsonc');
                }
              "
              # Ensure D1 tables exist
              npx wrangler d1 execute "$DB_NAME" --remote --file=scripts/d1-schema.sql || true
            else
              echo "::warning::No D1 database found matching 'b2b'. Please ensure D1 database is created in Cloudflare."
            fi
          fi

          npx wrangler deploy --keep-vars

      - name: Purge Cloudflare Edge Cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -n "$CLOUDFLARE_ZONE_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Purging Cloudflare Edge Cache for Zone: $CLOUDFLARE_ZONE_ID"
            curl -s --connect-timeout 10 --max-time 30 -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}' || true
          else
            echo "CLOUDFLARE_ZONE_ID not set; relying on 300s edge TTL"
          fi

  deploy-studio:
    runs-on: ubuntu-latest
    name: Deploy Studio
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'studio/package-lock.json'

      - name: Install Studio dependencies
        working-directory: studio
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npm rebuild esbuild || true

      - name: Build Sanity Studio
        working-directory: studio
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID || 'xvhhd8u0' }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET || 'production' }}
          SANITY_STUDIO_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID || 'xvhhd8u0' }}
          SANITY_STUDIO_DATASET: ${{ secrets.SANITY_DATASET || 'production' }}
          SANITY_STUDIO_SITE_URL: ${{ secrets.SANITY_STUDIO_SITE_URL || 'https://gwenvenni.com' }}
          SANITY_STUDIO_REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET || 'itsasecret' }}
          SANITY_TELEMETRY: 'false'
        run: |
          set -e -o pipefail
          npx sanity build -y
          if [ ! -f dist/index.html ]; then
            echo "::error title=Sanity Build Failure::dist/index.html was not generated!"
            exit 1
          fi

      - name: Deploy Studio to Cloudflare Workers
        working-directory: studio
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN secret is not set in GitHub Repository Secrets. Skipping Studio deploy step in GitHub Actions."
            exit 0
          fi
          if [ -n "$CF_ACCOUNT_ID" ]; then
            export CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT_ID"
          else
            echo "::notice::CLOUDFLARE_ACCOUNT_ID secret not set; Wrangler will auto-resolve if the API token is scoped to a single account."
          fi
          npx wrangler deploy --config wrangler.jsonc --keep-vars
